<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link href="style.css" rel="stylesheet">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .legend {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            padding: 12px 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            max-width: 260px;
            font-family: Arial, sans-serif;
        }
        .legend .info {
            font-weight: 600;
            margin-bottom: 6px;
        }
        .legend .Data {
            font-weight: 200;
            font-size: 0.9rem;
            color: #333;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 5px;
            padding: 12px 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            font-family: Arial, sans-serif;
        }
        .legend .links{
            font-weight: 200;
            font-size: 0.9rem;
            color: #333;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 5px;
            padding: 12px 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            font-family: Arial, sans-serif;
            

        }
    </style>
    <title>map_page</title>
</head>
<body>
    <div class="legend">
        <div class="info">The Flood simulation with DSM and DEM</div>
        <div class="Data">ČUZK - DEM lidar points - 
            <a href="https://cuzk.gov.cz/">Here</a>
        </div>

    </div>
    <div id="map"></div>
    <script src="../assets/flood2m.js"></script>
    <script src="../assets/flood1m.js"></script>
    <script src="js.js"></script>
</body>
</html>
